<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PalmPay — Create Merchant Account</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>
:root{--bg:#070710;--panel:#0d0e19;--border:rgba(169,140,255,.18);--text:#f7f4ff;--muted:#8e8da0;--accent:#a98cff;--gold:#ffbf61}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 20%,rgba(169,140,255,.1),transparent 30%),#05050a;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(590px,100%)}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;margin-bottom:16px}.brand i{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:rgba(169,140,255,.08);border:1px solid var(--border);color:var(--accent)}.card{padding:30px;border-radius:25px;background:linear-gradient(145deg,rgba(18,17,31,.97),rgba(9,9,16,.96));border:1px solid var(--border);box-shadow:0 30px 90px rgba(0,0,0,.45)}.eyebrow{font-size:10px;letter-spacing:2.2px;color:#77758b;text-transform:uppercase;font-weight:800}.card h1{margin:7px 0 8px;font-size:29px}.subtitle{margin:0 0 22px;color:var(--muted);font-size:12px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin-bottom:1px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:7px;color:#c5c2d2;font-size:10px;font-weight:800}.field input,.field select{width:100%;padding:13px 14px;border-radius:13px;border:1px solid rgba(255,255,255,.08);background:#11111c;color:#fff;outline:none}.field input:focus,.field select:focus{border-color:rgba(169,140,255,.55);box-shadow:0 0 0 3px rgba(169,140,255,.08)}.error{padding:11px 12px;border-radius:11px;margin-bottom:15px;background:rgba(255,100,120,.06);border:1px solid rgba(255,100,120,.16);color:#ff9cab;font-size:11px;line-height:1.5}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:49px;margin-top:16px;border-radius:13px;background:linear-gradient(135deg,#a98cff,#8267e9);color:#0b0815;text-decoration:none;font-weight:900;border:0;cursor:pointer}.foot{display:grid;gap:10px;text-align:center;margin-top:16px;font-size:10px}.foot a{color:#a7a4b4;text-decoration:none}.foot a:hover{color:var(--gold)}@media(max-width:610px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><main class="shell"><div class="brand"><i class="bi bi-shop-window"></i> PalmPay</div><section class="card"><div class="eyebrow">Merchant onboarding</div><h1>Create Merchant Account</h1><p class="subtitle">This account is separate from your Customer login and opens a dedicated business dashboard.</p>{% if error %}<div class="error"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>{% endif %}<form method="POST" action="{{ url_for('merchant_register') }}"><div class="grid"><div class="field"><label>Owner Name</label><input type="text" name="owner_name" placeholder="Your name" required></div><div class="field"><label>Business Name</label><input type="text" name="business_name" placeholder="Business name" maxlength="60" required></div><div class="field"><label>Indian Mobile Number</label><input type="tel" name="mobile" placeholder="10-digit number" maxlength="10" inputmode="numeric" pattern="[6-9][0-9]{9}" required></div><div class="field"><label>Category</label><select name="category"><option>Retail</option><option>Food & Beverage</option><option>Education</option><option>Services</option><option>Freelance</option><option>Other</option></select></div><div class="field full"><label>Business Email</label><input type="email" name="email" placeholder="business@example.com" required></div><div class="field"><label>Password</label><input type="password" name="password" placeholder="At least 6 characters" minlength="6" required></div><div class="field"><label>Account Type</label><input value="Merchant · Business" disabled></div></div><button class="btn" type="submit"><i class="bi bi-shop-window"></i> Create Merchant Account</button></form><div class="foot"><a href="{{ url_for('merchant_login') }}">Already have a merchant account? Login</a><a href="{{ url_for('login') }}">Customer Login</a><a href="{{ url_for('home') }}">← Back to account selection</a></div></section></main><script>document.querySelector('input[name="mobile"]').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,10);});</script></body></html>
