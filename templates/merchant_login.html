<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PalmPay — Merchant Login</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><style>
:root{--bg:#070710;--panel:#0d0e19;--border:rgba(169,140,255,.18);--text:#f7f4ff;--muted:#8e8da0;--accent:#a98cff;--gold:#ffbf61}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 15%,rgba(169,140,255,.11),transparent 30%),radial-gradient(circle at 85% 85%,rgba(255,191,97,.08),transparent 28%),#05050a;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(430px,100%)}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900;margin-bottom:18px}.brand i{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:rgba(169,140,255,.08);border:1px solid var(--border);color:var(--accent)}.card{padding:30px;border-radius:25px;background:linear-gradient(145deg,rgba(18,17,31,.97),rgba(9,9,16,.96));border:1px solid var(--border);box-shadow:0 30px 90px rgba(0,0,0,.45)}.eyebrow{font-size:10px;letter-spacing:2.2px;color:#77758b;text-transform:uppercase;font-weight:800}.card h1{margin:7px 0 8px;font-size:29px}.subtitle{margin:0 0 22px;color:var(--muted);font-size:12px;line-height:1.6}.field{margin-bottom:15px}.field label{display:block;margin-bottom:7px;color:#c5c2d2;font-size:10px;font-weight:800}.field input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid rgba(255,255,255,.08);background:#11111c;color:#fff;outline:none}.field input:focus{border-color:rgba(169,140,255,.55);box-shadow:0 0 0 3px rgba(169,140,255,.08)}.error{padding:11px 12px;border-radius:11px;margin-bottom:15px;background:rgba(255,100,120,.06);border:1px solid rgba(255,100,120,.16);color:#ff9cab;font-size:11px;line-height:1.5}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;margin-top:4px;border-radius:13px;background:linear-gradient(135deg,#a98cff,#8267e9);color:#0b0815;text-decoration:none;font-weight:900;border:0;cursor:pointer}.links{display:grid;gap:10px;margin-top:18px;text-align:center;font-size:10px}.links a{color:#aaa8b8;text-decoration:none}.links a:hover{color:var(--gold)}.merchant-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:rgba(255,191,97,.06);border:1px solid rgba(255,191,97,.16);color:var(--gold);font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:1px;margin-bottom:15px}</style></head><body><main class="shell"><div class="brand"><i class="bi bi-shop-window"></i> PalmPay</div><section class="card"><div class="merchant-badge"><i class="bi bi-buildings"></i> Merchant Portal</div><div class="eyebrow">Business account</div><h1>Merchant Login</h1><p class="subtitle">Sign in to your separate PalmPay business dashboard.</p>{% if error %}<div class="error"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>{% endif %}<form method="POST" action="{{ url_for('merchant_login') }}"><div class="field"><label>Email</label><input type="email" name="email" placeholder="business@example.com" autocomplete="username" required></div><div class="field"><label>Password</label><input type="password" name="password" placeholder="Enter merchant password" autocomplete="current-password" required></div><button class="btn" type="submit"><i class="bi bi-box-arrow-in-right"></i> Sign In to Merchant Portal</button></form><div class="links"><a href="{{ url_for('merchant_register') }}">Create a new merchant account</a><a href="{{ url_for('login') }}">Customer Login</a><a href="{{ url_for('home') }}">← Back to account selection</a></div></section></main></body></html>
